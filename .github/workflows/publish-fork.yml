name: publish-fork
# Preferred fork workflow.
# Closely follows the upstream publish structure while staying runnable on public forks.
run-name: publish-fork ${{ inputs.channel }}

on:
  workflow_dispatch:
    inputs:
      channel:
        description: App channel
        required: false
        type: choice
        options:
          - dev
          - beta
          - prod
        default: prod
      electron:
        description: Build Electron desktop artifacts
        required: false
        type: choice
        options:
          - "true"
          - "false"
        default: "true"
      create_release:
        description: Create GitHub Release and upload artifacts
        required: false
        type: choice
        options:
          - "false"
          - "true"
        default: "false"

concurrency: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.channel }}

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Compute version
        id: version
        shell: bash
        run: |
          echo "channel=${{ inputs.channel }}" >> "$GITHUB_OUTPUT"
          echo "version=0.0.0-${{ inputs.channel }}-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
          echo "tag=v0.0.0-${{ inputs.channel }}-${{ github.run_id }}" >> "$GITHUB_OUTPUT"

  build-cli:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true

      - uses: ./.github/actions/setup-bun

      - name: Build CLI
        run: ./packages/opencode/script/build.ts
        env:
          OPENCODE_CHANNEL: ${{ needs.version.outputs.channel }}
          OPENCODE_VERSION: ${{ needs.version.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: opencode-cli
          path: packages/opencode/dist

  build-electron:
    if: inputs.electron == 'true'
    needs:
      - version
      - build-cli
    continue-on-error: false
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: x86_64-apple-darwin
            platform_flag: --mac --x64
          - host: macos-latest
            target: aarch64-apple-darwin
            platform_flag: --mac --arm64
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            platform_flag: --win
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform_flag: --linux
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies (ubuntu only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm

      - name: Prepare
        run: bun ./scripts/prepare.ts
        working-directory: packages/desktop-electron
        env:
          OPENCODE_VERSION: ${{ needs.version.outputs.version }}
          OPENCODE_CHANNEL: ${{ needs.version.outputs.channel }}
          RUST_TARGET: ${{ matrix.settings.target }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          OPENCODE_BRAND_SUFFIX: Offline
          OPENCODE_ARTIFACT_PREFIX: opencode-offline-electron

      - name: Build
        run: bun run build
        working-directory: packages/desktop-electron
        env:
          OPENCODE_VERSION: ${{ needs.version.outputs.version }}
          OPENCODE_CHANNEL: ${{ needs.version.outputs.channel }}
          OPENCODE_BRAND_SUFFIX: Offline
          OPENCODE_ARTIFACT_PREFIX: opencode-offline-electron

      - name: Package
        run: npx electron-builder ${{ matrix.settings.platform_flag }} --publish never --config electron-builder.config.ts
        working-directory: packages/desktop-electron
        timeout-minutes: 60
        env:
          OPENCODE_VERSION: ${{ needs.version.outputs.version }}
          OPENCODE_CHANNEL: ${{ needs.version.outputs.channel }}
          OPENCODE_BRAND_SUFFIX: Offline
          OPENCODE_ARTIFACT_PREFIX: opencode-offline-electron

      - uses: actions/upload-artifact@v4
        with:
          name: opencode-electron-${{ matrix.settings.target }}
          path: packages/desktop-electron/dist/*

  release:
    if: inputs.create_release == 'true'
    needs:
      - version
      - build-cli
      - build-electron
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: opencode-*
          path: dist
          merge-multiple: false

      - name: Prepare release artifacts
        shell: bash
        run: |
          mkdir -p release
          
          # Copy CLI binaries (exclude debug files, yml, blockmap, etc)
          if [ -d "dist/opencode-cli" ]; then
            find dist/opencode-cli -type f \( -name "*.exe" -o -name "opencode-cli" -o -name "*.tar.gz" \) -exec cp {} release/ \;
          fi
          
          # Copy Electron installers and packages (only final distributions)
          find dist -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.zip" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" \) -exec cp {} release/ \;
          
          # Log what we're releasing
          echo "Release artifacts:"
          ls -lh release/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: OpenCode Offline ${{ needs.version.outputs.version }}
          draft: false
          prerelease: ${{ needs.version.outputs.channel != 'prod' }}
          generate_release_notes: true
          files: release/*